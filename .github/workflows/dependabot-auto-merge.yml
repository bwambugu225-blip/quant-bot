name: Dependabot auto-merge

# Dependabot PRs run with a read-only GITHUB_TOKEN, so this cannot merge from a
# plain `pull_request` event. Instead we react to the CI workflow finishing: at
# that point we have a normal write token, and we merge only if the `test` job
# actually passed. A failing or cancelled CI run leaves the PR open.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge:
    name: merge green dependabot PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Merge only if the tests passed
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // Gate 1: the whole CI run must be green.
            if (run.conclusion !== 'success') {
              core.info(`CI concluded "${run.conclusion}" for run ${run.id} — not merging.`);
              return;
            }

            // Resolve the open PR that produced this run.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open PR found for head ${run.head_sha} — nothing to do.`);
              return;
            }

            // Gate 2: only Dependabot's own PRs, and only non-draft ones.
            if (pr.user.login !== 'dependabot[bot]') {
              core.info(`PR #${pr.number} authored by ${pr.user.login} — not Dependabot.`);
              return;
            }
            if (pr.draft) {
              core.info(`PR #${pr.number} is a draft — leaving it open.`);
              return;
            }

            // Gate 3: confirm the `test` job itself is green, not merely that
            // some other job in the run succeeded.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const test = jobs.find(j => j.name === 'test');
            if (!test || test.conclusion !== 'success') {
              core.info(`Test job conclusion is "${test ? test.conclusion : 'missing'}" — not merging.`);
              return;
            }

            // All gates passed: merge the bump.
            try {
              await github.rest.pulls.merge({
                owner, repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`Merged Dependabot PR #${pr.number} (${pr.title}).`);
            } catch (err) {
              // A protected branch or a race with another run surfaces here.
              // Leave the PR open and report rather than failing the workflow.
              core.warning(`Could not merge PR #${pr.number}: ${err.message}`);
            }
