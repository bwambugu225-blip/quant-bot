<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Redirecting...</title></head>
<body style="background:#0d0c0a;color:#f0e8da;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;margin:0">
<div style="text-align:center">
  <div style="font-size:14px;margin-bottom:8px">Authenticating...</div>
  <div style="width:24px;height:24px;border:2px solid #d4a84b;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token1');
  const error = params.get('error_description') || params.get('error');
  if (token && window.opener) {
    window.opener.postMessage({ type: 'deriv_token', token: token }, window.location.origin);
    document.body.innerHTML = '<div style="text-align:center;color:#5a8f64;font-size:14px">✓ Authenticated! You may close this window.</div>';
    setTimeout(window.close, 1500);
  } else if (error && window.opener) {
    window.opener.postMessage({ type: 'deriv_error', error: error }, window.location.origin);
    document.body.innerHTML = '<div style="text-align:center;color:#c45a5a;font-size:14px">✗ ' + error + '</div>';
  } else {
    document.body.innerHTML = '<div style="text-align:center;color:#8a7e6a;font-size:14px">No token received. Close this window and try again.</div>';
  }
})();
</script>
</body>
</html>
